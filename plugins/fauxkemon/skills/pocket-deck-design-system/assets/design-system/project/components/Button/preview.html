<!-- @dsCard group="Primitives" height=260 subtitle="primary · reward · default · quiet · danger · strip · end-turn · sizes · circles · disabled" -->
<div class="pd-app" style="display:grid;gap:var(--space-4);padding:var(--space-4);background:var(--ground)">
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center">
    <button class="pd-button" data-variant="primary">Open</button>
    <button class="pd-button" data-variant="reward">Claim</button>
    <button class="pd-button">Offering Rates</button>
    <button class="pd-button" data-variant="quiet">View details</button>
    <button class="pd-button" data-variant="danger">Concede</button>
    <button class="pd-button" data-variant="strip">Skip</button>
    <button class="pd-button" data-variant="end-turn">End Turn</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center">
    <button class="pd-button" data-variant="primary" data-size="lg">Share</button>
    <button class="pd-button" data-size="sm">Cancel</button>
    <button class="pd-button" data-variant="primary" data-size="sm">OK</button>
    <button class="pd-button" data-shape="circle" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="pd-button" data-shape="circle" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="pd-button" data-shape="circle" data-size="sm" data-variant="strip" aria-label="Battle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="pd-button" data-shape="circle" data-variant="quiet" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg></button>
    <button class="pd-button" data-variant="primary" disabled>Save</button>
  </div>
</div>
