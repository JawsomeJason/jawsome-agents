<div class="pd-app" style="display:grid;gap:var(--space-4);padding:var(--space-4);background:var(--field)">
  <div style="width:390px;display:flex;justify-content:flex-end"><div class="pd-strip" data-side="opp"><span>Rival Ash-Tree</span><div class="pd-points" role="img" aria-label="Opponent's points: 1 of 3"><span class="pd-points__pip" data-filled></span><span class="pd-points__pip"></span><span class="pd-points__pip"></span></div></div></div>
  <div style="width:390px"><div class="pd-strip"><span>You</span><div class="pd-points" role="img" aria-label="Your points: 2 of 3"><span class="pd-points__pip" data-filled></span><span class="pd-points__pip" data-filled></span><span class="pd-points__pip"></span></div></div></div>
  <div style="width:390px"><div class="pd-strip"><span>You</span><span class="pd-strip__timer">17:00</span><div class="pd-points" role="img" aria-label="Your points: 0 of 3"><span class="pd-points__pip"></span><span class="pd-points__pip"></span><span class="pd-points__pip"></span></div></div></div>
</div>
