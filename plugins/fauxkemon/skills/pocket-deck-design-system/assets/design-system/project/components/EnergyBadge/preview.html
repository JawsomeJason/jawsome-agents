<!-- @dsCard group="Primitives" height=250 subtitle="10 types · 5 sizes · empty" -->
<div class="pd-app" style="display:grid;gap:var(--space-4);padding:var(--space-4);background:var(--ground)">
  <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-3)">
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="grass" data-size="lg" role="img" aria-label="Grass"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Grass</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="fire" data-size="lg" role="img" aria-label="Fire"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Fire</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="water" data-size="lg" role="img" aria-label="Water"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Water</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="lightning" data-size="lg" role="img" aria-label="Lightning"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Lightning</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="psychic" data-size="lg" role="img" aria-label="Psychic"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Psychic</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="fighting" data-size="lg" role="img" aria-label="Fighting"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Fighting</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="darkness" data-size="lg" role="img" aria-label="Darkness"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Darkness</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="metal" data-size="lg" role="img" aria-label="Metal"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Metal</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="dragon" data-size="lg" role="img" aria-label="Dragon"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Dragon</figcaption></figure>
    <figure style="margin:0;display:grid;justify-items:center;gap:var(--space-1)"><span class="pd-energy" data-type="colorless" data-size="lg" role="img" aria-label="Colorless"></span><figcaption style="font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)">Colorless</figcaption></figure>
  </div>
  <div style="display:flex;gap:var(--space-3);align-items:center">
    <span class="pd-energy" data-type="water" data-size="xs" aria-hidden="true"></span>
    <span class="pd-energy" data-type="water" data-size="sm" aria-hidden="true"></span>
    <span class="pd-energy" data-type="water" aria-hidden="true"></span>
    <span class="pd-energy" data-type="water" data-size="lg" aria-hidden="true"></span>
    <span class="pd-energy" data-type="water" data-size="xl" aria-hidden="true"></span>
    <span class="pd-energy" data-type="water" data-size="lg" data-state="empty" aria-hidden="true"></span>
  </div>
</div>
