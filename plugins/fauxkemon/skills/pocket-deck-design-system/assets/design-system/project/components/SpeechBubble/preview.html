<!-- @dsCard group="Primitives" height=190 subtitle="highlight bubble with a clipped strip of card thumbnails" -->
<div class="pd-app" style="display:grid;justify-content:center;padding:var(--space-6) var(--space-4) var(--space-8);background:var(--gradient-wall)">
  <div class="pd-bubble" style="width:277px">
    <div role="list" aria-label="Highlight cards" style="display:flex;justify-content:center;gap:var(--space-2);overflow:hidden;margin:0 calc(var(--space-3) * -1)">
      <article class="pd-card" data-type="grass" role="listitem" style="--pd-card-width:56px;flex:none" aria-label="Sproutling, 60 HP"><div class="pd-card__frame"></div><header class="pd-card__head"><h3 class="pd-card__name">Sproutling</h3><span class="pd-card__hp"><small>HP</small>60</span><span class="pd-energy" data-type="grass" aria-hidden="true"></span></header><div class="pd-card__art"></div></article>
      <article class="pd-card" data-type="fire" role="listitem" style="--pd-card-width:56px;flex:none" aria-label="Emberwyrm, 140 HP"><div class="pd-card__frame"></div><header class="pd-card__head"><h3 class="pd-card__name">Emberwyrm</h3><span class="pd-card__hp"><small>HP</small>140</span><span class="pd-energy" data-type="fire" aria-hidden="true"></span></header><div class="pd-card__art"></div></article>
      <article class="pd-card" data-type="water" role="listitem" style="--pd-card-width:56px;flex:none" aria-label="Tidecrest, 70 HP"><div class="pd-card__frame"></div><header class="pd-card__head"><h3 class="pd-card__name">Tidecrest</h3><span class="pd-card__hp"><small>HP</small>70</span><span class="pd-energy" data-type="water" aria-hidden="true"></span></header><div class="pd-card__art"></div></article>
      <article class="pd-card" data-type="lightning" role="listitem" style="--pd-card-width:56px;flex:none" aria-label="Voltwhisk, 50 HP"><div class="pd-card__frame"></div><header class="pd-card__head"><h3 class="pd-card__name">Voltwhisk</h3><span class="pd-card__hp"><small>HP</small>50</span><span class="pd-energy" data-type="lightning" aria-hidden="true"></span></header><div class="pd-card__art"></div></article>
      <article class="pd-card" data-type="psychic" role="listitem" style="--pd-card-width:56px;flex:none" aria-label="Auroralis, 120 HP"><div class="pd-card__frame"></div><header class="pd-card__head"><h3 class="pd-card__name">Auroralis</h3><span class="pd-card__hp"><small>HP</small>120</span><span class="pd-energy" data-type="psychic" aria-hidden="true"></span></header><div class="pd-card__art"></div></article>
    </div>
  </div>
</div>
