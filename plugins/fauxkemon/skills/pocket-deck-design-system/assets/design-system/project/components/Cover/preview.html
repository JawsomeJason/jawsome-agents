<!-- @dsCard height=300 -->
<div class="pd-cover pd-app" style="position:relative;width:960px;height:300px;background:var(--ground);overflow:hidden">
  <style>
    .pd-cover .wall{fill:url(#pd-wall)} .pd-cover .frame{fill:var(--card-frame)} .pd-cover .frame-hi{fill:var(--card-frame-highlight)}
    .pd-cover .b-fire{fill:var(--card-fire)} .pd-cover .b-water{fill:var(--card-water)} .pd-cover .b-grass{fill:var(--card-grass)} .pd-cover .b-crown{fill:var(--card-crown-body-2)}
    .pd-cover .art{fill:var(--surface-raised);opacity:.85}
    .pd-cover .coin{fill:var(--reward)} .pd-cover .coin-ring{fill:none;stroke:var(--on-reward);stroke-opacity:.35;stroke-width:1.5} .pd-cover .coin-empty{fill:var(--point-empty)}
    .pd-cover .coin-n{font-family:var(--font-numeral);font-style:italic;font-weight:800;font-size:15px;fill:var(--coin-ink);text-anchor:middle}
    .pd-cover .strip{fill:var(--strip)}
    .pd-cover h1{position:absolute;left:48px;top:44px;margin:0;max-width:440px;font-family:var(--font-display);font-weight:700;font-size:104px;line-height:.92;color:var(--ink);letter-spacing:-.02em}
    .pd-cover hr{position:absolute;left:50px;top:232px;width:300px}
    .pd-cover p{position:absolute;left:50px;top:246px;margin:0;max-width:440px;font-family:var(--font-text);font-size:14px;line-height:20px;color:var(--ink-muted)}
  </style>
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true" style="position:absolute;inset:0">
    <!-- A pack-screen wall (gradient-wall) behind a fan of card-proportioned slabs (63:88) with silver frames and
         measured body colours; three point coins in reward with Jost numerals echo the 3-point win. Radii follow
         the card: 3.67% of width. -->
    <defs>
      <linearGradient id="pd-wall" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#acd4f8"/><stop offset="1" stop-color="#5880e0"/></linearGradient>
    </defs>
    <path class="wall" d="M520 0h440v300H560Z" opacity=".9"/>
    <g transform="rotate(-12 700 170)">
      <rect class="frame" x="560" y="-20" width="236" height="330" rx="8.7"/><rect class="b-grass" x="570" y="-10" width="216" height="310" rx="4"/><rect class="art" x="586" y="20" width="184" height="126" rx="3"/>
    </g>
    <g transform="rotate(4 820 170)">
      <rect class="frame" x="730" y="30" width="190" height="265" rx="7"/><rect class="b-water" x="738" y="38" width="174" height="249" rx="3"/><rect class="art" x="751" y="62" width="148" height="101" rx="3"/>
    </g>
    <g transform="rotate(16 900 120)">
      <rect class="frame" x="866" y="-30" width="150" height="210" rx="5.5"/><rect class="b-crown" x="872" y="-24" width="138" height="198" rx="3"/>
    </g>
    <g transform="rotate(-5 600 240)">
      <rect class="frame" x="548" y="170" width="118" height="165" rx="4.3"/><rect class="b-fire" x="553" y="175" width="108" height="155" rx="2"/><rect class="art" x="561" y="190" width="92" height="63" rx="2"/>
    </g>
    <path class="strip" d="M520 262h190l-10 26H520Z"/>
    <circle class="coin" cx="648" cy="275" r="11"/><circle class="coin-ring" cx="648" cy="275" r="11"/><text class="coin-n" x="648" y="280">1</text>
    <circle class="coin" cx="674" cy="275" r="11"/><circle class="coin-ring" cx="674" cy="275" r="11"/><text class="coin-n" x="674" y="280">2</text>
    <circle class="coin-empty" cx="697" cy="275" r="9"/>
  </svg>
  <h1>Pocket Deck</h1>
  <hr class="pd-rule">
  <p>A measured, bright, fair interface for a pocket card game.</p>
</div>
