<div class="pd-app" style="display:flex;flex-wrap:wrap;gap:var(--space-8);align-items:end;padding:var(--space-4);background:var(--board)">
  <div class="pd-hp" style="--pd-hp:120;--pd-hp-max:120" role="meter" aria-valuenow="120" aria-valuemin="0" aria-valuemax="120" aria-label="HP"><span class="pd-hp__value">120<small>HP</small></span><span class="pd-hp__track"><span class="pd-hp__fill"></span></span></div>
  <div class="pd-hp" style="--pd-hp:50;--pd-hp-max:120" role="meter" aria-valuenow="50" aria-valuemin="0" aria-valuemax="120" aria-label="HP"><span class="pd-hp__value">50<small>HP</small></span><span class="pd-hp__track"><span class="pd-hp__fill"></span></span></div>
  <div class="pd-hp" style="--pd-hp:20;--pd-hp-max:120" role="meter" aria-valuenow="20" aria-valuemin="0" aria-valuemax="120" aria-label="HP"><span class="pd-hp__value">20<small>HP</small></span><span class="pd-hp__track"><span class="pd-hp__fill"></span></span></div>
  <div class="pd-hp" data-size="sm" style="--pd-hp:60;--pd-hp-max:70" role="meter" aria-valuenow="60" aria-valuemin="0" aria-valuemax="70" aria-label="HP"><span class="pd-hp__value">60<small>HP</small></span><span class="pd-hp__track"><span class="pd-hp__fill"></span></span></div>
