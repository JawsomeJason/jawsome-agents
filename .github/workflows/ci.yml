name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - run: npm ci
      - run: npm run format:check
      - run: node scripts/lint.mjs
      - run: node plugins/playbook/skills/playbook/scripts/playbook.mjs check --packs .
      - run: node --test 'scripts/*.test.mjs'
      - run: node --test 'plugins/standards/tests/*.test.mjs'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -r plugins/reference-craft/skills/reference-measure/scripts/requirements.txt
      - run: node --test 'plugins/reference-craft/tests/*.test.mjs'
        env:
          REFERENCE_MEASURE_PYTHON: ${{ runner.temp }}/venv/bin/python
          REFERENCE_MEASURE_REQUIRE_DEPS: '1'
      - run: node --test 'plugins/prompt-craft/tests/*.test.mjs'
      - run: git clone --depth 1 https://github.com/michael-denyer/pstack-claude "$RUNNER_TEMP/pstack-claude"
      - run: node --test 'plugins/playbook/tests/*.test.mjs'
        env:
          PSTACK_CLAUDE_README: ${{ runner.temp }}/pstack-claude/README.md
